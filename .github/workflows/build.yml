name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
      - name: Unit tests
        run: ./gradlew test --no-daemon
      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: |
          VERSION=$(grep -o 'versionName = "[0-9.]*"' app/build.gradle.kts | grep -o '[0-9.]*' | head -1)
          mv app/build/outputs/apk/debug/app-debug.apk "CloudClean-v${VERSION}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: CloudClean-APK
          path: CloudClean-v*.apk